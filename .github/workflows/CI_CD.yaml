name: Food Delivery Production Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  # Set to "true" to run CI/CD, or set to "false" to turn off the entire CI/CD
  ENABLE_CI_CD: "false"

  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: food_delivery_time_prediction

  DAGSHUB_REPO_OWNER: aryanupadhyay23
  DAGSHUB_REPO_NAME: Food-Delivery-Time-prediction

  MLFLOW_TRACKING_URI: https://dagshub.com/aryanupadhyay23/Food-Delivery-Time-prediction.mlflow


jobs:

  gate:
    name: Check CI/CD Master Switch
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Evaluate Master Switch
        id: check
        run: |
          if [ "${{ env.ENABLE_CI_CD }}" = "true" ]; then
            echo "CI/CD is ENABLED"
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "CI/CD is DISABLED in CI_CD.yaml (ENABLE_CI_CD=${{ env.ENABLE_CI_CD }})"
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

  ci:
    name: CI - Validate and Promote Model
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dev-requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - name: Lint Critical Errors
        run: |
          flake8 backend frontend \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull Raw Dataset via DVC
        run: dvc pull backend/data/raw/Zomato-Dataset.csv.dvc

      - name: Execute Full DVC Pipeline
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: ${{ env.DAGSHUB_REPO_OWNER }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          dvc repro

      - name: Push Generated Artifacts to DVC Remote
        run: |
          dvc push

      - name: Commit updated dvc.lock and metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dvc.lock backend/reports/
          git diff --staged --quiet || git commit -m "chore(ci): update dvc.lock and reports [skip ci]"
          git push || true

      - name: Promote Candidate to Staging
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: ${{ env.DAGSHUB_REPO_OWNER }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          python backend/src/models/promote_to_staging.py

      - name: Promote Staging to Production
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: ${{ env.DAGSHUB_REPO_OWNER }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          python backend/src/models/promote_to_production.py


  cd:
    name: CD - Build Test Push Deploy
    needs: ci
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Container Health Test
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |

          docker run -d --name test_container \
            -p 8080:8080 \
            -e DAGSHUB_TOKEN=$DAGSHUB_TOKEN \
            -e MLFLOW_TRACKING_USERNAME=${{ env.DAGSHUB_REPO_OWNER }} \
            -e MLFLOW_TRACKING_PASSWORD=$DAGSHUB_TOKEN \
            -e MLFLOW_TRACKING_URI=${{ env.MLFLOW_TRACKING_URI }} \
            app:${{ github.sha }}

          for i in {1..30}; do
            sleep 2
            if curl -s http://localhost:8080/health | grep healthy; then
              echo "API healthy"
              break
            fi
          done

          echo "=== Test Container Logs ==="
          docker logs test_container

          curl --fail http://localhost:8080/health

          docker stop test_container
          docker rm test_container

      - name: Tag Image for ECR
        run: |
          docker tag app:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

          docker tag app:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest

      - name: Push Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest

      - name: Package Deployment Files
        run: |
          zip -r deployment.zip \
          appspec.yml \
          deploy/scripts/install_dependencies.sh \
          deploy/scripts/start_docker.sh

      - name: Upload Deployment Zip to S3
        run: |
          aws s3 cp deployment.zip \
          s3://fooddeliverytimepredictiondeployments3/deployment.zip

      - name: Deploy via CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name food-delivery-time-prediction-app \
            --deployment-group-name food-delivery-time-prediction-group \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=fooddeliverytimepredictiondeployments3,key=deployment.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE \
            --region ${{ env.AWS_REGION }}