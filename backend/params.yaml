data_splitting:
  test_size: 0.20
  random_state: 42


model_training:

  LightGBM_Regressor:
    n_estimators: 534
    max_depth: 12
    learning_rate: 0.02563
    num_leaves: 178
    min_child_samples: 39
    subsample: 0.5041
    colsample_bytree: 0.9097
    reg_alpha: 1.4079
    reg_lambda: 5.7211
    random_state: 42
    n_jobs: -1
    verbose: -1

  RandomForest_Regressor:
    n_estimators: 290
    max_depth: 14
    min_samples_split: 7
    min_samples_leaf: 1
    max_features: null
    bootstrap: true
    random_state: 42
    n_jobs: -1

  Stacking_Regressor:
    cv: 5
    n_jobs: -1
    passthrough: false

  Meta_Model:
    max_depth: 6
    min_samples_split: 7
    min_samples_leaf: 8
    random_state: 42


promotion_policy:

  staging_thresholds:

    performance:
      min_test_r2: 0.82
      max_test_mae: 6.0

    diagnostics:
      max_avg_latency_ms: 120
      max_extreme_errors: 2
      extreme_error_threshold: 15