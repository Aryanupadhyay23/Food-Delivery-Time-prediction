stages:

  data_cleaning:
    cmd: python backend/src/data/data_cleaning.py
    deps:
      - backend/src/data/data_cleaning.py
      - backend/data/raw/Zomato-Dataset.csv
    outs:
      - backend/data/processed/food_delivery_cleaned.csv

  data_splitting:
    cmd: python backend/src/features/data_splitting.py
    deps:
      - backend/src/features/data_splitting.py
      - backend/data/processed/food_delivery_cleaned.csv
      - backend/params.yaml
    outs:
      - backend/data/processed/train.csv
      - backend/data/processed/test.csv

  data_preprocessing:
    cmd: python backend/src/features/data_preprocessing.py
    deps:
      - backend/src/features/data_preprocessing.py
      - backend/data/processed/train.csv
    outs:
      - backend/artifacts/preprocessor.pkl

  model_training:
    cmd: python backend/src/models/model_training.py
    deps:
      - backend/src/models/model_training.py
      - backend/data/processed/train.csv
      - backend/artifacts/preprocessor.pkl
      - backend/params.yaml
    outs:
      - backend/models/stacking_lgb_rf_pipeline.joblib

  model_evaluation:
    cmd: python backend/src/models/model_evaluation.py
    deps:
      - backend/src/models/model_evaluation.py
      - backend/data/processed/train.csv
      - backend/data/processed/test.csv
      - backend/models/stacking_lgb_rf_pipeline.joblib
    metrics:
      - backend/reports/metrics.json:
          cache: false

  model_diagnostics:
    cmd: python backend/src/models/model_diagnostics.py
    deps:
      - backend/src/models/model_diagnostics.py
      - backend/data/processed/test.csv
      - backend/models/stacking_lgb_rf_pipeline.joblib
      - backend/params.yaml
    metrics:
      - backend/reports/diagnostics_metrics.json:
          cache: false
    outs:
      - backend/reports/diagnostics